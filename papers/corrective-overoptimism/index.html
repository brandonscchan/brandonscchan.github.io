<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Corrective Overoptimism — Brandon S.C. Chan</title>
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://brandonscchan.github.io/papers/corrective-overoptimism/">
  <script>
    (function () {
      var FALLBACK_DRIVE = "https://drive.google.com/file/d/1WN9ZlMECQUX0bFbhMdSP_QgzlSCmf_OA/view?usp=share_link";
      var params = new URLSearchParams(window.location.search);
      var ref = params.get("ref") || document.referrer || "direct";

      function go(targetUrl) {
        try {
          if (targetUrl.indexOf("papermark") !== -1) {
            var u = new URL(targetUrl);
            if (ref && !u.searchParams.has("utm_source")) {
              u.searchParams.set("utm_source", ref);
            }
            targetUrl = u.toString();
          }
        } catch (_) {}
        window.location.replace(targetUrl);
      }

      if (params.get("mode") === "drive") {
        go(FALLBACK_DRIVE);
        return;
      }

      fetch("../../content.json", { cache: "no-store" })
        .then(function (r) { return r.json(); })
        .then(function (data) {
          var wp = (data.working_papers && data.working_papers[0]) || {};
          var t = (wp.document_targets && wp.document_targets.pdf) || {};
          go(t.papermark_url || t.drive_url || FALLBACK_DRIVE);
        })
        .catch(function () {
          go(FALLBACK_DRIVE);
        });
    })();
  </script>
  <noscript>
    <meta http-equiv="refresh" content="0; url=https://drive.google.com/file/d/1WN9ZlMECQUX0bFbhMdSP_QgzlSCmf_OA/view?usp=share_link">
  </noscript>
</head>
