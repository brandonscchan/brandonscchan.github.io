        "abstract": "Booms in infrastructure investment often coincide with investor exuberance and disappointment, yet the resulting networks endure. I show that investor overoptimism can correct a fundamental market failure: agents with diagnostic expectations over-extrapolate good news and sink irreversible capital, pushing underinvestment toward the efficient level. I embed this mechanism—corrective overoptimism—in a dynamic spatial model with endogenous infrastructure and estimate it for England and Wales from 1710 to 1881, spanning the turnpike, canal, and railway booms. The estimated degree of overreaction (θ = 1.06) aligns with evidence from modern settings and explains railway investors’ traffic forecasts at opening. Without diagnostic expectations, the 1881 transport network would be fifteen percent smaller, eliminating eleven percent of railway-era gains in real output per capita and eight percent of real-wage gains. Corrective overoptimism can be a potent channel for growth."
